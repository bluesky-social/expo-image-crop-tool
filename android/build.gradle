plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'xyz.blueskyweb.expoimagecroptool'
version = '0.1.0'

android {
  namespace "xyz.blueskyweb.expoimagecroptool"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'com.vanniktech:android-image-cropper:4.6.0'
}
